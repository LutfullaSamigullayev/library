openapi: 3.0.3
info:
  title: DevBook API
  description: |
    Bu API foydalanuvchi autentifikatsiyasi, ro‘yxatdan o‘tish, parol tiklash va rollarni boshqarish uchun xizmat qiladi.
    <br>**Auth modul** Swagger dokumentatsiyasi.
  version: 1.0.0
  contact:
    name: DevBook API Team
    email: samigullayevlutfulla@gmail.com

servers:
  - url: http://localhost:4001
    description: Local server
  - url: https://your-production-domain.com
    description: Production server

tags:
  - name: Auth
    description: Foydalanuvchi autentifikatsiyasi va ruxsat tizimi

paths:
  /register:
    post:
      tags: [Auth]
      summary: Foydalanuvchini ro‘yxatdan o‘tkazish
      description: Yangi foydalanuvchini ro‘yxatdan o‘tkazadi va email orqali OTP yuboradi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  example: johndoe
                email:
                  type: string
                  example: johndoe@gmail.com
                password:
                  type: string
                  example: Secret123
      responses:
        201:
          description: Foydalanuvchi muvaffaqiyatli ro‘yxatdan o‘tdi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    example: "Registered"
        400:
          description: Noto‘g‘ri ma’lumot kiritilgan

  /verify:
    post:
      tags: [Auth]
      summary: Emailni tasdiqlash (OTP orqali)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  example: johndoe@gmail.com
                otp:
                  type: string
                  example: "123456"
      responses:
        201:
          description: Foydalanuvchi muvaffaqiyatli tasdiqlandi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    example: Foydalanuvchi muvaffaqiyatli ro‘yxatdan o‘tdi!
                  access:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

  /login:
    post:
      tags: [Auth]
      summary: Tizimga kirish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: johndoe@gmail.com
                password:
                  type: string
                  example: Secret123
      responses:
        200:
          description: Tizimga muvaffaqiyatli kirildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    example: Tizimga muvaffaqiyatli kirildi!
                  access:
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        401:
          description: Email yoki parol xato

  /forget_password:
    post:
      tags: [Auth]
      summary: Parolni unutgan foydalanuvchi uchun OTP yuborish
      description: Foydalanuvchining email manziliga tasdiqlash kodi yuboriladi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: johndoe@gmail.com
      responses:
        201:
          description: Tasdiqlash kodi emailingizga yuborildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    example: Tasdiqlash kodi emailingizga yuborildi!

  /reset_password:
    post:
      tags: [Auth]
      summary: Parolni tiklash
      description: Email va OTP yordamida yangi parol o‘rnatadi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
                - new_password
              properties:
                email:
                  type: string
                  example: johndoe@gmail.com
                otp:
                  type: string
                  example: "123456"
                new_password:
                  type: string
                  example: NewSecret123
      responses:
        201:
          description: Parol muvaffaqiyatli tiklandi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    example: Parolingiz muvaffaqiyatli yangilandi!
                  access:
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

  /to_admin:
    put:
      tags: [Auth]
      summary: Foydalanuvchini admin qilish
      description: Faqat **super_admin** rolidagi foydalanuvchilar ushbu endpointdan foydalana oladi.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  example: johndoe@gmail.com
      responses:
        201:
          description: Foydalanuvchi roli admin’ga o‘zgartirildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    example: Update user
        401:
          description: Siz Super Admin emassiz

  /refresh:
    get:
      tags: [Auth]
      summary: Access tokenni yangilash
      description: Refresh token orqali yangi access token generatsiya qiladi.
      security:
        - cookieAuth: []
      responses:
        201:
          description: Access token muvaffaqiyatli yangilandi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    example: AccessToken
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

  /logout:
    get:
      tags: [Auth]
      summary: Foydalanuvchini tizimdan chiqarish
      responses:
        200:
          description: Logout muvaffaqiyatli bajarildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    example: Logout

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: AccessToken
